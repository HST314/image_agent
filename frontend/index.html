<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#6d28d9">
  <title>Image Agent Studio</title>
  <style>
    /* 设计令牌来自 design-system/image-agent-studio，组件只引用语义令牌。 */
    :root {
      --primary:#6d28d9;--primary-hover:#5b21b6;--primary-soft:#f3e8ff;--on-primary:#fff;
      --accent:#be185d;--bg:#f8f7fb;--surface:#fff;--surface-raised:#fff;--text:#171126;
      --muted:#655d72;--subtle:#f1eef5;--border:#ded8e7;--danger:#b42318;--danger-soft:#fef3f2;
      --success:#18794e;--success-soft:#ecfdf3;--warning:#8a4b0f;--warning-soft:#fff7ed;
      --focus:#7c3aed;--shadow:0 12px 32px rgba(40,28,62,.08);--radius:16px;--radius-sm:10px;
      --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;
      --ease:180ms cubic-bezier(.2,.8,.2,1);--sidebar:280px;
      font-family:"DM Sans","Noto Sans SC",system-ui,-apple-system,sans-serif;
    }
    @media(prefers-color-scheme:dark){:root{--primary:#a78bfa;--primary-hover:#c4b5fd;--primary-soft:#2e2140;--on-primary:#171126;--accent:#f472b6;--bg:#100d16;--surface:#191520;--surface-raised:#211b2a;--text:#f4f0f8;--muted:#bbb2c6;--subtle:#28212f;--border:#403748;--danger:#fda29b;--danger-soft:#3b1c22;--success:#75e0a7;--success-soft:#153629;--warning:#fec84b;--warning-soft:#3b2b13;--shadow:0 16px 38px rgba(0,0,0,.28)}}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;min-height:100dvh;background:var(--bg);color:var(--text);font-size:16px;line-height:1.55}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}a{color:inherit}.skip-link{position:fixed;left:12px;top:-60px;z-index:100;background:var(--surface);padding:12px 16px;border-radius:8px}.skip-link:focus{top:12px}
    :focus-visible{outline:3px solid var(--focus);outline-offset:3px}.app{min-height:100dvh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100dvh;padding:24px 18px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;z-index:20}.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}.brand__mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:white;background:linear-gradient(145deg,#7c3aed,#be185d);box-shadow:0 8px 18px rgba(109,40,217,.25)}.brand__mark svg{width:22px}.brand strong{display:block;font-size:17px}.brand span{display:block;color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
    .sidebar__title{margin:8px 10px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.project-list{display:grid;gap:6px;overflow:auto;padding:2px}.project-item{width:100%;min-height:58px;padding:10px 12px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left;transition:background var(--ease),border-color var(--ease)}.project-item:hover{background:var(--subtle)}.project-item[aria-current=true]{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 28%,transparent)}.project-item strong,.project-item span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-item span{font-size:12px;color:var(--muted);margin-top:2px}.sidebar__empty{padding:20px 12px;color:var(--muted);font-size:14px}.sidebar__footer{margin-top:auto;padding-top:16px}.system-state{display:flex;align-items:center;gap:8px;padding:12px;border-radius:12px;background:var(--subtle);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px color-mix(in srgb,var(--success) 14%,transparent)}
    .main{min-width:0}.topbar{min-height:76px;padding:14px clamp(16px,3vw,40px);border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px}.mobile-menu{display:none}.topbar__context{min-width:0}.eyebrow{margin:0;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.topbar h1{font-family:"Space Grotesk","Noto Sans SC",sans-serif;margin:0;font-size:clamp(20px,2vw,27px);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.topbar__actions{margin-left:auto;display:flex;gap:8px}.content{width:min(1240px,100%);margin:0 auto;padding:clamp(20px,3vw,40px)}
    .hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.6fr);gap:18px;margin-bottom:24px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.hero__main{padding:clamp(24px,4vw,44px);background:radial-gradient(circle at 92% 5%,color-mix(in srgb,var(--primary) 14%,transparent),transparent 38%),var(--surface)}.hero h2{font-family:"Space Grotesk","Noto Sans SC",sans-serif;font-size:clamp(28px,4vw,46px);letter-spacing:-.04em;line-height:1.1;margin:12px 0}.hero p{max-width:62ch;color:var(--muted);margin:0 0 24px}.hero__aside{padding:24px;display:grid;align-content:space-between;gap:22px}.stat-label{font-size:13px;color:var(--muted)}.stat-value{font-family:"Space Grotesk",sans-serif;font-size:30px;font-weight:700}.hint{padding:13px 14px;border-radius:10px;background:var(--primary-soft);color:color-mix(in srgb,var(--primary) 85%,var(--text));font-size:13px}
    .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:9px 15px;font-weight:700;transition:background var(--ease),border-color var(--ease),box-shadow var(--ease),opacity var(--ease)}.btn svg,.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.btn--primary{background:var(--primary);color:var(--on-primary)}.btn--primary:hover:not(:disabled){background:var(--primary-hover);box-shadow:0 7px 18px color-mix(in srgb,var(--primary) 25%,transparent)}.btn--secondary{background:var(--surface);border-color:var(--border)}.btn--secondary:hover:not(:disabled){background:var(--subtle);border-color:var(--primary)}.btn--danger{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 25%,transparent)}.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--border);border-radius:10px;background:var(--surface)}.button-row{display:flex;gap:10px;flex-wrap:wrap}
    .workspace{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.65fr);gap:18px}.workspace__primary,.workspace__rail{display:grid;gap:18px;align-content:start}.section{padding:clamp(18px,2.5vw,28px)}.section__head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.section__head h2,.section__head h3{font-family:"Space Grotesk","Noto Sans SC",sans-serif;margin:0;font-size:20px}.section__head p{margin:4px 0 0;color:var(--muted);font-size:14px}.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:var(--subtle);font-size:12px;font-weight:700}.badge--success{color:var(--success);background:var(--success-soft)}.badge--warning{color:var(--warning);background:var(--warning-soft)}.badge--danger{color:var(--danger);background:var(--danger-soft)}
    .stepper{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.step{min-width:0}.step__bar{height:5px;border-radius:99px;background:var(--border);margin-bottom:8px}.step.is-done .step__bar,.step.is-current .step__bar{background:var(--primary)}.step.is-current .step__bar{box-shadow:0 0 0 3px var(--primary-soft)}.step span{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.step.is-current span{color:var(--text);font-weight:700}
    .stage{min-height:240px}.empty{min-height:230px;display:grid;place-items:center;text-align:center;padding:28px}.empty__icon{width:58px;height:58px;margin:auto;border-radius:18px;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary)}.empty__icon svg{width:27px;fill:none;stroke:currentColor;stroke-width:1.8}.empty h3{margin:14px 0 6px}.empty p{max-width:45ch;margin:0 auto 18px;color:var(--muted)}
    .field{display:grid;gap:6px;margin-bottom:15px}.field label,.field legend{font-weight:700;font-size:14px}.field small{color:var(--muted)}.input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg);transition:border-color var(--ease),box-shadow var(--ease)}textarea.input{min-height:110px;resize:vertical}.input:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}.field-error{color:var(--danger);font-size:13px}.switch-row{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--subtle)}.switch-row input{width:20px;height:20px;accent-color:var(--primary)}.switch-row strong,.switch-row span{display:block}.switch-row span{font-size:13px;color:var(--muted)}
    .candidate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.candidate{padding:0;border:2px solid var(--border);border-radius:13px;overflow:hidden;background:var(--surface);text-align:left;transition:border-color var(--ease),box-shadow var(--ease)}.candidate:hover,.candidate[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}.candidate__image{aspect-ratio:1;background:linear-gradient(135deg,var(--subtle),var(--primary-soft));display:grid;place-items:center;overflow:hidden}.candidate__image img{width:100%;height:100%;object-fit:cover}.candidate__image svg{width:34px;stroke:var(--muted);fill:none}.candidate__label{display:block;padding:12px;font-weight:700}.markdown{white-space:pre-wrap;padding:16px;border-radius:10px;background:var(--subtle);max-height:360px;overflow:auto;font:14px/1.65 ui-monospace,SFMono-Regular,monospace}
    .timeline{display:grid;gap:0}.timeline__item{position:relative;padding:0 0 18px 26px}.timeline__item:before{content:"";position:absolute;left:6px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--primary)}.timeline__item:after{content:"";position:absolute;left:9px;top:18px;bottom:0;width:1px;background:var(--border)}.timeline__item:last-child:after{display:none}.timeline__item strong{font-size:14px}.timeline__item time{display:block;color:var(--muted);font-size:12px}.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}.offline-banner{display:flex;gap:10px;padding:13px;border:1px solid color-mix(in srgb,var(--warning) 30%,transparent);border-radius:10px;background:var(--warning-soft);color:var(--warning);font-size:13px}.offline-banner svg{width:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
    .skeleton{height:18px;border-radius:7px;background:linear-gradient(90deg,var(--subtle),var(--border),var(--subtle));background-size:200% 100%;animation:shimmer 1.3s infinite}.skeleton+.skeleton{margin-top:10px;width:72%}@keyframes shimmer{to{background-position:-200% 0}}.spinner{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .toast-region{position:fixed;right:18px;bottom:18px;z-index:50;display:grid;gap:10px;width:min(390px,calc(100vw - 36px))}.toast{padding:14px 16px;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:12px;background:var(--surface-raised);box-shadow:var(--shadow);animation:toast-in .2s ease-out}.toast--error{border-left-color:var(--danger)}@keyframes toast-in{from{opacity:0;transform:translateY(8px)}}.dialog{border:0;padding:0;width:min(660px,calc(100vw - 32px));max-height:88dvh;border-radius:18px;background:var(--surface);color:var(--text);box-shadow:0 24px 70px rgba(0,0,0,.3)}.dialog::backdrop{background:rgba(12,8,18,.58);backdrop-filter:blur(3px)}.dialog__head,.dialog__body,.dialog__foot{padding:20px 24px}.dialog__head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.dialog__head h2{margin:0;font-size:21px}.dialog__body{overflow:auto;max-height:62dvh}.dialog__foot{border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .ge-stage{position:relative;width:100%;height:min(56vh,520px);border:1px solid var(--border);border-radius:12px;background:var(--subtle);overflow:hidden;margin-bottom:14px}.ge-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}.ge-stage canvas{position:absolute;touch-action:none;cursor:crosshair}.ge-stage__status{position:absolute;left:12px;bottom:12px;margin:0;padding:6px 10px;border-radius:8px;background:color-mix(in srgb,var(--surface) 88%,transparent);font-size:13px;color:var(--muted)}.ge-stage__status:empty{display:none}
    .ge-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.ge-toolbar .btn{min-height:40px;padding:7px 13px}.ge-toolbar [aria-pressed=true]{border-color:var(--primary);background:var(--primary-soft)}.ge-field{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700}.ge-field input[type=color]{width:44px;height:40px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.ge-field input[type=range]{width:120px;accent-color:var(--primary)}.ge-status{min-height:20px;margin:10px 0 0;font-size:14px;color:var(--muted)}
    .hist-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:18px;align-items:start}
    .hist-list{display:grid;gap:10px;align-content:start}
    .hist-node{width:100%;display:grid;gap:6px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-align:left;transition:border-color var(--ease),box-shadow var(--ease),background var(--ease)}
    .hist-node:hover{background:var(--subtle)}
    .hist-node[aria-current=true]{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
    .hist-node__meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
    .hist-chips{display:flex;gap:6px;flex-wrap:wrap}
    .hist-chip{padding:2px 8px;border-radius:999px;background:var(--subtle);font-size:11px;font-weight:700;color:var(--muted)}
    .hist-detail{min-width:0}
    .hist-fact{padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:12px}
    .hist-fact h4{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:14px}
    .hist-assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
    .hist-asset{display:block;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--subtle);text-decoration:none}
    .hist-asset img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:var(--surface)}
    .hist-asset span{display:block;padding:6px 8px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hist-asset.is-broken{display:grid;place-items:center;min-height:92px}
    .hist-asset.is-broken:after{content:attr(data-note);padding:10px;font-size:12px;color:var(--danger);text-align:center}
    @media(max-width:1023px){.hist-grid{grid-template-columns:1fr}}
    @media(max-width:767px){.ge-stage{height:min(48vh,420px)}}
    @media(max-width:1023px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;width:min(320px,88vw);transform:translateX(-105%);transition:transform var(--ease);box-shadow:var(--shadow)}.sidebar.is-open{transform:none}.mobile-menu{display:grid}.hero,.workspace{grid-template-columns:1fr}.hero__aside{grid-template-columns:1fr 1fr}.workspace__rail{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace__rail .panel:last-child{grid-column:1/-1}}
    @media(max-width:767px){.topbar{min-height:66px}.topbar__actions .btn span{display:none}.content{padding:16px}.hero__aside,.workspace__rail{grid-template-columns:1fr}.workspace__rail .panel:last-child{grid-column:auto}.stepper{display:flex;overflow-x:auto;padding-bottom:8px}.step{min-width:110px}.candidate-grid{grid-template-columns:1fr}.section__head{display:block}.section__head .badge{margin-top:8px}.dialog__head,.dialog__body,.dialog__foot{padding:16px}.dialog__foot{flex-direction:column-reverse}.dialog__foot .btn{width:100%}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="工程导航">
      <div class="brand"><div class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M5 19 19 5M7 5h12v12M5 9v10h10"/></svg></div><div><strong>Image Agent</strong><span>Studio workspace</span></div></div>
      <p class="sidebar__title">最近工程</p><nav id="project-list" class="project-list" aria-label="工程列表"><div class="sidebar__empty">正在读取工程…</div></nav>
      <div class="sidebar__footer"><div class="system-state"><span class="dot" id="health-dot"></span><span id="health-text">正在连接服务</span></div></div>
    </aside>
    <main class="main" id="main" tabindex="-1">
      <header class="topbar"><button class="icon-btn mobile-menu" id="menu-button" aria-label="打开工程导航" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="topbar__context"><p class="eyebrow" id="context-label">创作工作台</p><h1 id="page-title">开始一项新的视觉创作</h1></div><div class="topbar__actions"><button class="btn btn--secondary" id="refresh-button"><svg viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5M18.5 9A7 7 0 0 0 6 6.5L4 11m16 2-2 4.5A7 7 0 0 1 5.5 15"/></svg><span>刷新</span></button><button class="btn btn--primary" id="new-button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>新建工程</span></button></div></header>
      <div class="content" id="content" aria-live="polite"></div>
    </main>
  </div>
  <div class="toast-region" id="toasts" aria-live="polite" aria-atomic="true"></div>
  <dialog class="dialog" id="project-dialog" aria-labelledby="dialog-title"><form id="project-form"><div class="dialog__head"><h2 id="dialog-title">新建创作工程</h2><button type="button" class="icon-btn" data-close aria-label="关闭对话框"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="dialog__body"><div class="field"><label for="project-id">工程 ID <span aria-hidden="true">*</span></label><input class="input" id="project-id" name="project_id" required minlength="2" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_-]{1,63}" placeholder="campaign-visual-01" aria-describedby="project-help project-error"><small id="project-help">使用字母、数字、下划线或连字符，创建后不可更改。</small><div class="field-error" id="project-error" role="alert"></div></div><div class="field"><label for="task-json">ImageTaskCard JSON <span aria-hidden="true">*</span></label><textarea class="input" id="task-json" name="task_json" required spellcheck="false" aria-describedby="task-help task-error"></textarea><small id="task-help">必须符合生产后端 ImageTaskCard 契约，最多 512 KiB。</small><div class="field-error" id="task-error" role="alert"></div></div><label class="switch-row"><input type="checkbox" id="offline"><span><strong>显式离线测试模式</strong><span>使用模拟图片验证流程；模拟结果不能最终交付。</span></span></label></div><div class="dialog__foot"><button type="button" class="btn btn--secondary" data-close>取消</button><button type="submit" class="btn btn--primary" id="create-button">创建并启动</button></div></form></dialog>
  <dialog class="dialog" id="reopen-dialog" aria-labelledby="reopen-title"><div class="dialog__head"><h2 id="reopen-title">从历史节点重开新分支</h2><button type="button" class="icon-btn" id="reopen-close" aria-label="关闭对话框"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="dialog__body"><div id="reopen-preview-body"></div><div class="field"><label for="reopen-name">新分支名称</label><input class="input" id="reopen-name" maxlength="64" placeholder="留空则由服务端自动生成" aria-describedby="reopen-name-error"><div class="field-error" id="reopen-name-error" role="alert"></div></div><div class="field"><label for="reopen-actor">操作者标识 <span aria-hidden="true">*</span></label><input class="input" id="reopen-actor" maxlength="256" placeholder="你的名字或工号" aria-describedby="reopen-actor-error"><div class="field-error" id="reopen-actor-error" role="alert"></div></div><p class="ge-status" id="reopen-status" role="status"></p></div><div class="dialog__foot"><button type="button" class="btn btn--secondary" id="reopen-cancel">取消</button><button type="button" class="btn btn--primary" id="reopen-confirm">确认创建新分支</button></div></dialog>
  <script>
    'use strict';

      if(Array.isArray(value)){
        if(value.length&&value.every(v=>v&&typeof v==='object'&&typeof v.artifact_id==='string'))
          return `<div class="hist-assets">${value.map(v=>histAssetCard({artifact_id:v.artifact_id,note:[v.style_index||v.slot||v.id,v.title].filter(Boolean).join(' · ')})).join('')}</div>`;
        return `<div class="markdown">${escapeHtml(JSON.stringify(value,null,2))}</div>`;
      }
      if(typeof value==='object'){
        const scalars=Object.entries(value).filter(([,v])=>v==null||['string','number','boolean'].includes(typeof v));
        const complex=Object.entries(value).filter(([,v])=>!(v==null||['string','number','boolean'].includes(typeof v)));
        const kv=scalars.length?`<dl class="kv">${scalars.map(([k,v])=>`<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(String(v==null?'—':v))}</dd>`).join('')}</dl>`:'';
        const rest=complex.map(([k,v])=>`<p style="margin:8px 0 4px;color:var(--muted);font-size:13px">${escapeHtml(k)}</p>${histFactBody(k,v)}`).join('');
        return kv+rest||'<p style="color:var(--muted)">—</p>';
      }
      const text=String(value);
      if(text.length>120||text.includes('\n'))return `<div class="markdown">${escapeHtml(text)}</div>`;
      return `<p>${escapeHtml(text)}</p>`;
    }
    function histAssetUrl(ref){const pid=state.current&&state.current.project_id;return pid&&/^artifact_[a-f0-9]{64}$/.test(String(ref||''))?`/api/projects/${encodeURIComponent(pid)}/assets/${encodeURIComponent(ref)}`:''}
    function histAssetCard(a){
      const id=String(a&&a.artifact_id||'');
      const serverPath=typeof a.download_path==='string'&&a.download_path.startsWith('/api/projects/')?a.download_path:'';
      const path=serverPath||histAssetUrl(id);
      const note=String(a.note||'');
      if(!path)return `<div class="hist-asset is-broken" data-note="资产引用无效或越权不可见"><span>${escapeHtml(id||'未知资产')}</span></div>`;
      return `<a class="hist-asset" href="${escapeAttr(path)}" target="_blank" rel="noopener" title="在新页打开原始资产（只读）"><img loading="lazy" src="${escapeAttr(path)}" alt="历史资产 ${escapeAttr(id)}" onerror="this.style.display='none';this.parentElement.classList.add('is-broken');this.parentElement.setAttribute('data-note','资产加载失败或不可见')"><span>${escapeHtml(note||id.slice(0,18)+'…')}</span></a>`;
    }
    function bindHistory(){
      const on=(id,fn)=>{const el=$('#'+id);if(el)el.addEventListener('click',fn)};
      on('hist-reload',()=>{if(historyUi.key)histLoadPage(null)});
      on('hist-retry',()=>{if(historyUi.key)histLoadPage(null)});
      on('hist-more',()=>{if(historyUi.nextCursor)histLoadPage(historyUi.nextCursor)});
      on('hist-detail-retry',()=>{if(historyUi.selected)histSelect(historyUi.selected)});
      on('hist-reopen',()=>histReopenOpen());
      for(const it of historyUi.items){const el=$('#hist-node-'+it.node_id);if(el)el.addEventListener('click',()=>histSelect(it.node_id))}
    }
    function histReopenOpen(){
      const d=historyUi.detail;
      if(!d||d.availability!=='available'||!d.node_id)return;
      histReopenReset();
      historyUi.reopenNode=d.node_id;
      const nameEl=$('#reopen-name');if(nameEl)nameEl.value='';
      const actorEl=$('#reopen-actor');if(actorEl){try{actorEl.value=localStorage.getItem('studio-actor')||''}catch{}}
      const ne=$('#reopen-name-error');if(ne)ne.textContent='';
      const ae=$('#reopen-actor-error');if(ae)ae.textContent='';
      const dlg=$('#reopen-dialog');if(dlg&&dlg.showModal)dlg.showModal();
      histReopenFetch();
    }
    async function histReopenFetch(){
      const pid=historyUi.key,node=historyUi.reopenNode;
      if(!pid||!node)return;
      historyUi.previewStatus='loading';historyUi.previewError='';historyUi.confirmError='';historyUi.confirmHint='';
      histReopenRender();
      const nameEl=$('#reopen-name');
      const name=(nameEl&&nameEl.value||'').trim();
      try{
        const [preview,branches]=await Promise.all([
          api(`/api/projects/${encodeURIComponent(pid)}/history/${encodeURIComponent(node)}/reopen-preview`,{method:'POST',body:JSON.stringify(name.length>=2?{name}:{})}),
          api(`/api/projects/${encodeURIComponent(pid)}/branches`)]);
        if(historyUi.key!==pid||historyUi.reopenNode!==node)return;
        historyUi.preview=preview;
        historyUi.expectedVersion=Number.isInteger(branches&&branches.version)?branches.version:null;
        historyUi.previewStatus='ready';
      }catch(e){
        if(historyUi.key!==pid||historyUi.reopenNode!==node)return;
        historyUi.previewError=e.message;historyUi.previewStatus='error';
      }
      histReopenRender();
    }
    function histReopenRender(){
      const body=$('#reopen-preview-body');if(!body)return;
      const status=$('#reopen-status');
      if(status){status.textContent=historyUi.confirmError||historyUi.confirmHint||'';status.style.color=historyUi.confirmError?'var(--danger)':''}
      const confirm=$('#reopen-confirm');
      if(confirm){confirm.disabled=historyUi.previewStatus!=='ready'||historyUi.expectedVersion==null||historyUi.confirming;confirm.textContent=historyUi.confirming?'正在创建新分支…':'确认创建新分支'}
      if(historyUi.previewStatus==='idle'){body.innerHTML='';return}
      if(historyUi.previewStatus==='loading'){body.innerHTML='<div class="skeleton"></div><div class="skeleton"></div><p style="color:var(--muted);font-size:13px">正在生成只读重开预览…</p>';return}
      if(historyUi.previewStatus==='error'){
        body.innerHTML=`<div class="empty"><div><div class="empty__icon">${icons.info}</div><h3>预览生成失败</h3><p>${escapeHtml(historyUi.previewError)}</p><button type="button" class="btn btn--secondary" id="reopen-preview-retry">重试预览</button></div></div>`;
        const r=$('#reopen-preview-retry');if(r)r.addEventListener('click',()=>histReopenFetch());
        return;
      }
      const p=historyUi.preview||{};
      const nb=p.new_branch||{};
      const inv=Array.isArray(p.invalidated_confirmations)?p.invalidated_confirmations:[];
      body.innerHTML=`<p class="hint">只读预览：确认前不会创建分支、不会移动当前 head，也不会修改任何历史；取消此对话框不产生任何写入。</p><dl class="kv"><dt>源节点</dt><dd>${escapeHtml(p.checkpoint||'—')}</dd><dt>父分支</dt><dd>${escapeHtml(p.parent_branch||'—')}（${escapeHtml(String(p.parent_branch_id||'—').slice(0,18))}…）</dd><dt>fork checkpoint</dt><dd>${escapeHtml(nb.fork_checkpoint||'—')}</dd><dt>新分支</dt><dd>使用下方输入的名称，留空则由服务端自动生成</dd></dl><h4 style="margin:12px 0 6px">重开后将失效的既有确认关系</h4><div class="hist-chips">${inv.map(k=>`<span class="hist-chip">${escapeHtml(HIST_INVALIDATED_LABELS[k]||k)}</span>`).join('')||'<span class="hist-chip">无</span>'}</div>`;
    }
    async function histReopenConfirm(){
      if(historyUi.confirming||historyUi.previewStatus!=='ready'||historyUi.expectedVersion==null)return;
      const pid=historyUi.key,preview=historyUi.preview;
      if(!pid||!preview)return;
      const nameEl=$('#reopen-name'),actorEl=$('#reopen-actor');
      const name=(nameEl&&nameEl.value||'').trim(),actor=(actorEl&&actorEl.value||'').trim();
      const nameOk=!name||/^[A-Za-z0-9][A-Za-z0-9_-]{1,63}$/.test(name);
      const ne=$('#reopen-name-error'),ae=$('#reopen-actor-error');
      if(ne)ne.textContent=nameOk?'':'分支名称需为 2–64 位字母、数字、下划线或连字符。';
      if(ae)ae.textContent=actor?'':'请填写操作者标识。';
      if(!actor||!nameOk)return;
      historyUi.confirming=true;historyUi.confirmError='';historyUi.confirmHint='正在创建新分支…';
      histReopenRender();
      const body={checkpoint:preview.checkpoint,actor,expected_version:historyUi.expectedVersion};
      if(name)body.name=name;
      try{
        const result=await api(`/api/projects/${encodeURIComponent(pid)}/branches`,{method:'POST',body:JSON.stringify(body)});
        try{localStorage.setItem('studio-actor',actor)}catch{}
        histReopenClose();
        toast(`已从历史节点创建并切换到新分支${name?`：${name}`:'。'}`);
        if(result&&result.project)state.current=result.project;
        else state.current=await api(`/api/projects/${encodeURIComponent(pid)}`);
        histReset();
        await loadProjects();
        renderProject();renderNav();
      }catch(e){
        historyUi.confirmHint='';
        if(e&&e.status===409&&/版本冲突/.test(e.message||'')){
          try{const branches=await api(`/api/projects/${encodeURIComponent(pid)}/branches`);if(Number.isInteger(branches&&branches.version))historyUi.expectedVersion=branches.version}catch{}
          historyUi.confirmError='分支版本冲突：其他操作已移动分支状态。已刷新最新版本，请核对后再次确认。';
        }else if(e&&e.status===404){historyUi.confirmError=`历史节点或分支已不存在：${e.message}`}
        else if(e&&e.status===422){historyUi.confirmError=`输入未通过校验：${e.message}`}
        else if(e&&e.status===423){historyUi.confirmError='工程正在由另一个流程处理，请稍后重试。'}
        else if(e&&e.status===409){historyUi.confirmError=e.message}
        else{historyUi.confirmError=`创建未完成：${e.message}`}
      }finally{historyUi.confirming=false;histReopenRender()}
    }
    function histReopenClose(){const dlg=$('#reopen-dialog');if(dlg&&dlg.close)dlg.close();histReopenReset()}
    function renderTimeline(events=[]){const recent=events.slice(-6).reverse();if(!recent.length)return '<p style="color:var(--muted)">暂无活动记录。</p>';return `<div class="timeline">${recent.map(e=>`<div class="timeline__item"><strong>${escapeHtml(eventLabel(e))}</strong><time>${formatDate(e.timestamp)}</time></div>`).join('')}</div>`}function eventLabel(e){const x={project_created:'创建工程',step_started:'开始处理',step_succeeded:'完成节点',step_failed:'处理失败',branch_created:'创建分支',retry_started:'开始重试',inspection_completed:'完成画面质检',rework_completed:'完成画面返工'};return `${x[e.type]||'记录进度'}${e.state?' · '+(labels[e.state]||e.state):''}`}function formatDate(v){if(!v)return '—';try{return new Intl.DateTimeFormat('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return v}}
    async function advance(payload={},endpoint='advance'){
      if(!state.current||jobUi.busy)return;
      const pid=state.current.project_id;jobUi.busy=true;setBusy(true,'后端正在处理，进度完成后会自动刷新…');
      try{
        const accepted=await api(`/api/projects/${encodeURIComponent(pid)}/${endpoint}`,{method:'POST',body:JSON.stringify({...payload,offline:state.offline})});
        if(endpoint!=='advance'){state.current=accepted;await loadProjects();renderProject();toast('已保存到新的工作流检查点。');return}
        if(!accepted||!accepted.status_url)throw new Error('服务返回了无法识别的受理响应。');
        jobUi.key=pid;jobUi.payload=payload;jobUi.jobId=accepted.job_id||'';jobUi.statusUrl=accepted.status_url;jobWatchSave(pid);
        const job=await pollJob(pid,accepted.status_url);jobUi.job=job;
        if(String(job.status)==='failed'){jobWatchSave(pid);state.current=await api(`/api/projects/${encodeURIComponent(pid)}`);await loadProjects();renderProject();toast(errToastText(job.error),'error');return}
        jobWatchClear(pid);jobUi.job=null;jobUi.payload=null;
        state.current=await api(`/api/projects/${encodeURIComponent(pid)}`);await loadProjects();renderProject();
        toast(String(job.status)==='cancelled'?'任务已取消。':'已保存到新的工作流检查点。');
      }catch(e){toast(e.message,'error');try{state.current=await api(`/api/projects/${encodeURIComponent(pid)}`);renderProject()}catch{}}finally{jobUi.busy=false;jobUi.cancelling=false;setBusy(false);jobNoteClear()}
    }
    function showCreate(){const d=$('#project-dialog');$('#task-json').value=JSON.stringify(sample,null,2);$('#project-id').value='';$('#offline').checked=state.offline;$('#project-error').textContent='';$('#task-error').textContent='';d.showModal();setTimeout(()=>$('#project-id').focus(),0)}function closeDialog(){$('#project-dialog').close()}
    async function createProject(ev){ev.preventDefault();const id=$('#project-id').value.trim();let task;$('#project-error').textContent='';$('#task-error').textContent='';if(!/^[A-Za-z0-9][A-Za-z0-9_-]{1,63}$/.test(id)){ $('#project-error').textContent='请输入 2–64 位合法工程 ID。';$('#project-id').focus();return}try{task=JSON.parse($('#task-json').value)}catch{$('#task-error').textContent='JSON 格式无效，请检查逗号、引号和括号。';$('#task-json').focus();return}state.offline=$('#offline').checked;localStorage.setItem('studio-offline',String(state.offline));setBusy(true,'正在创建并启动真实工作流…');try{state.current=await api('/api/projects',{method:'POST',body:JSON.stringify({project_id:id,task_card:task,offline:state.offline})});closeDialog();await loadProjects();renderProject();toast('工程已创建并保存首个检查点。')}catch(e){$('#task-error').textContent=e.message;toast(e.message,'error')}finally{setBusy(false)}}
    function closeSidebar(){$('#sidebar').classList.remove('is-open');$('#menu-button').setAttribute('aria-expanded','false')}
    document.addEventListener('click',e=>{const project=e.target.closest('[data-project]'),n=e.target.closest('[data-new]'),action=e.target.closest('[data-action]'),confirm=e.target.closest('[data-confirm]'),manual=e.target.closest('[data-manual]'),quality=e.target.closest('[data-quality]'),candidate=e.target.closest('[data-candidate]');if(project)openProject(project.dataset.project);if(n)showCreate();if(action)advance({},action.dataset.action==='retry'?'retry':'advance');if(confirm){const actor=prompt('请输入操作者标识');if(!actor)return;if(confirm.dataset.confirm==='task')advance({task_spec_action:'confirm',actor});if(confirm.dataset.confirm==='final')advance({final_action:'confirm',actor});if(confirm.dataset.confirm==='continue')advance({final_action:'continue',actor})}if(manual)advance({manual_action:manual.dataset.manual});if(quality){const actor=prompt('请输入操作者标识');if(!actor)return;const expense_confirmed=quality.dataset.quality!=='continue_generation'||confirm('继续生成将开启新的付费预算段。确认本次费用影响并继续？');if(expense_confirmed)advance({quality_action:quality.dataset.quality,actor,expense_confirmed,idempotency_key:`quality-${quality.dataset.quality}-${Date.now()}`})}if(candidate){$$('[data-candidate]').forEach(x=>x.setAttribute('aria-pressed',String(x===candidate)));$('#select-button').disabled=false;$('#select-button').dataset.selected=candidate.dataset.candidate}});
    document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();const fd=new FormData(e.target),answers={};for(const [k,v] of fd){if(k.endsWith('__custom'))continue;const custom=fd.get(`${k}__custom`);answers[k]=String(custom||v).trim()}advance({clarification_answers:answers})}});
    $('#content').addEventListener('click',e=>{const btn=e.target.closest('#select-button');if(btn&&state.current?.snapshot?.phase==='waiting_master_selection'&&btn.dataset.selected)advance({selected_id:btn.dataset.selected})});$('#new-button').addEventListener('click',showCreate);$('#refresh-button').addEventListener('click',()=>state.current?openProject(state.current.project_id):loadProjects().then(renderHome));$('#project-form').addEventListener('submit',createProject);const onInit=(id,ev,fn)=>{const el=$('#'+id);if(el)el.addEventListener(ev,fn)};onInit('reopen-close','click',histReopenClose);onInit('reopen-cancel','click',histReopenClose);onInit('reopen-confirm','click',histReopenConfirm);onInit('reopen-dialog','cancel',e=>{e.preventDefault();histReopenClose()});$$('[data-close]').forEach(b=>b.addEventListener('click',closeDialog));$('#project-dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});$('#menu-button').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('is-open');$('#menu-button').setAttribute('aria-expanded',String(open))});
    loadProjects().then(renderHome);
  </script>
