<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#6d28d9">
  <title>Image Agent Studio</title>
  <style>
    /* 设计令牌来自 design-system/image-agent-studio，组件只引用语义令牌。 */
    :root {

    }
    @media(prefers-color-scheme:dark){:root{--primary:#a78bfa;--primary-hover:#c4b5fd;--primary-soft:#2e2140;--on-primary:#171126;--accent:#f472b6;--bg:#100d16;--surface:#191520;--surface-raised:#211b2a;--text:#f4f0f8;--muted:#bbb2c6;--subtle:#28212f;--border:#403748;--danger:#fda29b;--danger-soft:#3b1c22;--success:#75e0a7;--success-soft:#153629;--warning:#fec84b;--warning-soft:#3b2b13;--shadow:0 16px 38px rgba(0,0,0,.28)}}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;min-height:100dvh;background:var(--bg);color:var(--text);font-size:16px;line-height:1.55}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}a{color:inherit}.skip-link{position:fixed;left:12px;top:-60px;z-index:100;background:var(--surface);padding:12px 16px;border-radius:8px}.skip-link:focus{top:12px}
    :focus-visible{outline:3px solid var(--focus);outline-offset:3px}.app{min-height:100dvh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100dvh;padding:24px 18px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;z-index:20}.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}.brand__mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:white;background:linear-gradient(145deg,#7c3aed,#be185d);box-shadow:0 8px 18px rgba(109,40,217,.25)}.brand__mark svg{width:22px}.brand strong{display:block;font-size:17px}.brand span{display:block;color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
    .sidebar__title{margin:8px 10px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.project-list{display:grid;gap:6px;overflow:auto;padding:2px}.project-item{width:100%;min-height:58px;padding:10px 12px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left;transition:background var(--ease),border-color var(--ease)}.project-item:hover{background:var(--subtle)}.project-item[aria-current=true]{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 28%,transparent)}.project-item strong,.project-item span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-item span{font-size:12px;color:var(--muted);margin-top:2px}.sidebar__empty{padding:20px 12px;color:var(--muted);font-size:14px}.sidebar__footer{margin-top:auto;padding-top:16px}.system-state{display:flex;align-items:center;gap:8px;padding:12px;border-radius:12px;background:var(--subtle);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px color-mix(in srgb,var(--success) 14%,transparent)}
    .main{min-width:0}.topbar{min-height:76px;padding:14px clamp(16px,3vw,40px);border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px}.mobile-menu{display:none}.topbar__context{min-width:0}.eyebrow{margin:0;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.topbar h1{font-family:"Space Grotesk","Noto Sans SC",sans-serif;margin:0;font-size:clamp(20px,2vw,27px);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.topbar__actions{margin-left:auto;display:flex;gap:8px}.content{width:min(1240px,100%);margin:0 auto;padding:clamp(20px,3vw,40px)}
    .hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.6fr);gap:18px;margin-bottom:24px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.hero__main{padding:clamp(24px,4vw,44px);background:radial-gradient(circle at 92% 5%,color-mix(in srgb,var(--primary) 14%,transparent),transparent 38%),var(--surface)}.hero h2{font-family:"Space Grotesk","Noto Sans SC",sans-serif;font-size:clamp(28px,4vw,46px);letter-spacing:-.04em;line-height:1.1;margin:12px 0}.hero p{max-width:62ch;color:var(--muted);margin:0 0 24px}.hero__aside{padding:24px;display:grid;align-content:space-between;gap:22px}.stat-label{font-size:13px;color:var(--muted)}.stat-value{font-family:"Space Grotesk",sans-serif;font-size:30px;font-weight:700}.hint{padding:13px 14px;border-radius:10px;background:var(--primary-soft);color:color-mix(in srgb,var(--primary) 85%,var(--text));font-size:13px}
    .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:9px 15px;font-weight:700;transition:background var(--ease),border-color var(--ease),box-shadow var(--ease),opacity var(--ease)}.btn svg,.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.btn--primary{background:var(--primary);color:var(--on-primary)}.btn--primary:hover:not(:disabled){background:var(--primary-hover);box-shadow:0 7px 18px color-mix(in srgb,var(--primary) 25%,transparent)}.btn--secondary{background:var(--surface);border-color:var(--border)}.btn--secondary:hover:not(:disabled){background:var(--subtle);border-color:var(--primary)}.btn--danger{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 25%,transparent)}.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--border);border-radius:10px;background:var(--surface)}.button-row{display:flex;gap:10px;flex-wrap:wrap}
    .workspace{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.65fr);gap:18px}.workspace__primary,.workspace__rail{display:grid;gap:18px;align-content:start}.section{padding:clamp(18px,2.5vw,28px)}.section__head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.section__head h2,.section__head h3{font-family:"Space Grotesk","Noto Sans SC",sans-serif;margin:0;font-size:20px}.section__head p{margin:4px 0 0;color:var(--muted);font-size:14px}.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:var(--subtle);font-size:12px;font-weight:700}.badge--success{color:var(--success);background:var(--success-soft)}.badge--warning{color:var(--warning);background:var(--warning-soft)}.badge--danger{color:var(--danger);background:var(--danger-soft)}
    .stepper{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.step{min-width:0}.step__bar{height:5px;border-radius:99px;background:var(--border);margin-bottom:8px}.step.is-done .step__bar,.step.is-current .step__bar{background:var(--primary)}.step.is-current .step__bar{box-shadow:0 0 0 3px var(--primary-soft)}.step span{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.step.is-current span{color:var(--text);font-weight:700}
    .stage{min-height:240px}.empty{min-height:230px;display:grid;place-items:center;text-align:center;padding:28px}.empty__icon{width:58px;height:58px;margin:auto;border-radius:18px;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary)}.empty__icon svg{width:27px;fill:none;stroke:currentColor;stroke-width:1.8}.empty h3{margin:14px 0 6px}.empty p{max-width:45ch;margin:0 auto 18px;color:var(--muted)}
    .field{display:grid;gap:6px;margin-bottom:15px}.field label,.field legend{font-weight:700;font-size:14px}.field small{color:var(--muted)}.input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg);transition:border-color var(--ease),box-shadow var(--ease)}textarea.input{min-height:110px;resize:vertical}.input:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}.field-error{color:var(--danger);font-size:13px}.switch-row{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--subtle)}.switch-row input{width:20px;height:20px;accent-color:var(--primary)}.switch-row strong,.switch-row span{display:block}.switch-row span{font-size:13px;color:var(--muted)}
    .candidate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.candidate{padding:0;border:2px solid var(--border);border-radius:13px;overflow:hidden;background:var(--surface);text-align:left;transition:border-color var(--ease),box-shadow var(--ease)}.candidate:hover,.candidate[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}.candidate__image{aspect-ratio:1;background:linear-gradient(135deg,var(--subtle),var(--primary-soft));display:grid;place-items:center;overflow:hidden}.candidate__image img{width:100%;height:100%;object-fit:cover}.candidate__image svg{width:34px;stroke:var(--muted);fill:none}.candidate__label{display:block;padding:12px;font-weight:700}.markdown{white-space:pre-wrap;padding:16px;border-radius:10px;background:var(--subtle);max-height:360px;overflow:auto;font:14px/1.65 ui-monospace,SFMono-Regular,monospace}
    .timeline{display:grid;gap:0}.timeline__item{position:relative;padding:0 0 18px 26px}.timeline__item:before{content:"";position:absolute;left:6px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--primary)}.timeline__item:after{content:"";position:absolute;left:9px;top:18px;bottom:0;width:1px;background:var(--border)}.timeline__item:last-child:after{display:none}.timeline__item strong{font-size:14px}.timeline__item time{display:block;color:var(--muted);font-size:12px}.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}.offline-banner{display:flex;gap:10px;padding:13px;border:1px solid color-mix(in srgb,var(--warning) 30%,transparent);border-radius:10px;background:var(--warning-soft);color:var(--warning);font-size:13px}.offline-banner svg{width:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
    .skeleton{height:18px;border-radius:7px;background:linear-gradient(90deg,var(--subtle),var(--border),var(--subtle));background-size:200% 100%;animation:shimmer 1.3s infinite}.skeleton+.skeleton{margin-top:10px;width:72%}@keyframes shimmer{to{background-position:-200% 0}}.spinner{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

    .ge-stage{position:relative;width:100%;height:min(56vh,520px);border:1px solid var(--border);border-radius:12px;background:var(--subtle);overflow:hidden;margin-bottom:14px}.ge-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}.ge-stage canvas{position:absolute;touch-action:none;cursor:crosshair}.ge-stage__status{position:absolute;left:12px;bottom:12px;margin:0;padding:6px 10px;border-radius:8px;background:color-mix(in srgb,var(--surface) 88%,transparent);font-size:13px;color:var(--muted)}.ge-stage__status:empty{display:none}
    .ge-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.ge-toolbar .btn{min-height:40px;padding:7px 13px}.ge-toolbar [aria-pressed=true]{border-color:var(--primary);background:var(--primary-soft)}.ge-field{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700}.ge-field input[type=color]{width:44px;height:40px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.ge-field input[type=range]{width:120px;accent-color:var(--primary)}.ge-status{min-height:20px;margin:10px 0 0;font-size:14px;color:var(--muted)}
    .hist-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:18px;align-items:start}
    .hist-list{display:grid;gap:10px;align-content:start}
    .hist-node{width:100%;display:grid;gap:6px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-align:left;transition:border-color var(--ease),box-shadow var(--ease),background var(--ease)}
    .hist-node:hover{background:var(--subtle)}
    .hist-node[aria-current=true]{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
    .hist-node__meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
    .hist-chips{display:flex;gap:6px;flex-wrap:wrap}
    .hist-chip{padding:2px 8px;border-radius:999px;background:var(--subtle);font-size:11px;font-weight:700;color:var(--muted)}
    .hist-detail{min-width:0}
    .hist-fact{padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:12px}
    .hist-fact h4{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:14px}
    .hist-assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
    .hist-asset{display:block;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--subtle);text-decoration:none}
    .hist-asset img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:var(--surface)}
    .hist-asset span{display:block;padding:6px 8px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hist-asset.is-broken{display:grid;place-items:center;min-height:92px}
    .hist-asset.is-broken:after{content:attr(data-note);padding:10px;font-size:12px;color:var(--danger);text-align:center}
    .obs-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:start}
    .obs-progress{display:grid;gap:12px;align-content:start}
    .obs-kvrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
    .obs-slots{display:flex;gap:8px;flex-wrap:wrap}
    .obs-slot{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--border);border-radius:10px;background:var(--subtle);font-size:12px;font-weight:700;color:var(--muted)}
    .obs-slot.is-ok{border-color:var(--success);background:var(--success-soft);color:var(--success)}
    .obs-slot.is-fail{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
    .obs-log{display:grid;gap:8px;align-content:start;max-height:520px;overflow:auto}
    .obs-event{display:grid;gap:4px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:13px}
    .obs-event__meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
    .obs-event__trace{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted)}
    .obs-stream{display:inline-flex;align-items:center;gap:7px}
    .obs-dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
    .obs-dot.is-live{background:var(--success)}
    .obs-dot.is-down{background:var(--warning)}
    .trace-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:18px;align-items:start}
    .trace-list{display:grid;gap:10px;align-content:start}
    .trace-detail{min-width:0}
    .trace-chain{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .trace-chip{border:1px solid var(--border);border-radius:999px;background:var(--surface);padding:6px 10px;font-size:12px;font-weight:700;color:var(--text)}
    .trace-chip:hover:not(:disabled){border-color:var(--primary);background:var(--subtle)}
    .trace-chip.is-current{border-color:var(--primary);background:var(--primary-soft)}
    .trace-chain__arrow{color:var(--muted);font-size:12px}
    .trace-flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .trace-flow__step{display:inline-flex;align-items:center;gap:6px}
    .trace-flow__step time{font-size:11px;color:var(--muted)}
    .trace-flow__arrow{color:var(--muted)}
    .trace-text{max-height:300px}
    .trace-refs{margin-top:14px;display:grid;gap:8px;justify-items:start}
    .trace-refs p{margin:0;color:var(--muted);font-size:13px}
    .stgs-grid{display:grid;gap:12px}
    .stgs-field{padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
    .stgs-field__head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .stgs-field__head code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:700}
    .stgs-field__help{margin:8px 0 6px;color:var(--muted);font-size:13px}
    .stgs-chips{display:flex;gap:6px;flex-wrap:wrap}
    .stgs-chip{padding:2px 8px;border-radius:999px;background:var(--subtle);font-size:11px;font-weight:700;color:var(--muted)}
    .stgs-chip.is-staged{background:var(--primary-soft);color:var(--primary)}
    .stgs-editor{display:grid;gap:8px;margin-top:10px;padding:12px;border:1px dashed var(--border);border-radius:10px;background:var(--subtle)}
    .stgs-detail{margin-top:10px;padding:12px;border-radius:10px;background:var(--subtle);font-size:13px}
    .stgs-bar{position:sticky;bottom:12px;margin-top:14px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-raised);box-shadow:var(--shadow);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .hlth-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:start}
    .hlth-card h3{margin-top:0}
    .hlth-overall{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
    .hlth-components{display:grid;gap:10px;margin-top:12px}
    .hlth-component{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
    .hlth-component__head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .hlth-diag{margin-top:12px;padding:12px;border:1px dashed var(--border);border-radius:10px;background:var(--subtle)}
    .hlth-diag__body{max-height:280px;font-size:12px}
    @media(max-width:1023px){.hist-grid{grid-template-columns:1fr}.obs-grid{grid-template-columns:1fr}.trace-grid{grid-template-columns:1fr}.hlth-grid{grid-template-columns:1fr}.stgs-bar{position:static}}
    @media(max-width:767px){.ge-stage{height:min(48vh,420px)}}
    @media(max-width:1023px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;width:min(320px,88vw);transform:translateX(-105%);transition:transform var(--ease);box-shadow:var(--shadow)}.sidebar.is-open{transform:none}.mobile-menu{display:grid}.hero,.workspace{grid-template-columns:1fr}.hero__aside{grid-template-columns:1fr 1fr}.workspace__rail{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace__rail .panel:last-child{grid-column:1/-1}}
    @media(max-width:767px){.topbar{min-height:66px}.topbar__actions .btn span{display:none}.content{padding:16px}.hero__aside,.workspace__rail{grid-template-columns:1fr}.workspace__rail .panel:last-child{grid-column:auto}.stepper{display:flex;overflow-x:auto;padding-bottom:8px}.step{min-width:110px}.candidate-grid{grid-template-columns:1fr}.section__head{display:block}.section__head .badge{margin-top:8px}.dialog__head,.dialog__body,.dialog__foot{padding:16px}.dialog__foot{flex-direction:column-reverse}.dialog__foot .btn{width:100%}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>

    const historyUi={key:'',listStatus:'idle',items:[],nextCursor:null,listError:'',loadingMore:false,selected:'',detailStatus:'idle',detail:null,detailError:'',reopenNode:'',previewStatus:'idle',preview:null,previewError:'',expectedVersion:null,confirming:false,confirmError:'',confirmHint:''};
    const OBS_PAGE=50;let OBS_RECONNECT_MS=2000;
    const OBS_STATUS_LABELS={queued:'排队中',running:'处理中',succeeded:'已成功',failed:'失败',cancel_requested:'正在取消',cancelled:'已取消',waiting:'等待人工',retrying:'重试中',recovered:'已恢复',partial:'部分完成',idle:'空闲'};
    const OBS_EVENT_LABELS={project_created:'创建工程',step_started:'开始节点',step_succeeded:'完成节点',step_failed:'节点失败',job_queued:'任务入队',job_started:'任务开始',job_finished:'任务结束',job_cancel_requested:'请求取消',job_recovered:'worker 恢复',retry_started:'开始重试',candidate_succeeded:'候选图完成',candidate_failed:'候选图失败',inspection_started:'开始质检',inspection_presented:'质检结果',inspection_completed:'完成质检',inspection_reused:'复用质检',calibration_round_limit_reached:'返工到限',calibration_invalidated:'校准失效',calibration_current_asset_accepted:'校准通过',calibration_terminated_without_delivery:'终止交付',quality_disposition_recorded:'质量处置',waiting_human_approval:'等待人工审批',task_spec_confirmed:'任务书确认',task_spec_confirmation_invalidated:'任务书确认失效',human_rework_completed:'人工修改完成',rework_started:'开始返工',rework_completed:'完成返工',round_checkpointed:'轮次检查点',branch_created:'创建分支',branch_switched:'切换分支',final_asset_confirmed:'最终确认',final_confirmation_declined:'最终确认退回',delivery_generated:'交付生成',delivery_returned:'交付回传',delivery_note_generation_failed:'说明生成失败',parallel:'并行推进',resume_probe:'恢复探测',model_config_loaded:'模型配置加载',skill_degraded:'Skill 降级',skill_load_blocked:'Skill 加载受阻',legacy_asset_invalidated:'旧资产失效',legacy_asset_migrated:'旧资产迁移',tick:'心跳'};
    const OBS_UNIT_LABELS={candidate:'候选图',workflow:'工作流单元',round:'质检轮次',asset:'资产'};
    const obsUi={key:'',logStatus:'idle',items:[],seenSeq:new Set(),seenIds:new Set(),nextCursor:null,throughSequence:null,lastSeq:0,logError:'',logErrorStatus:0,logErrorTrace:'',loadingMore:false,pulling:false,endReached:false,streamStatus:'idle',source:null,reconnectTimer:0,progressStatus:'idle',progress:null,progressError:'',progressTrace:'',progressInFlight:false};
    const traceUi={key:'',listStatus:'idle',items:[],nextCursor:null,listError:'',listErrorStatus:0,loadingMore:false,selected:'',summaryStatus:'idle',summary:null,summaryError:'',summaryErrorStatus:0,chainStatus:'idle',chain:[],chainError:'',textStatus:'idle',textItems:[],textSeen:new Set(),textAfter:0,textHasMore:false,textComplete:false,textFinal:null,textError:'',textErrorStatus:0,textLoading:false,detailStatus:'idle',detail:null,detailError:'',detailForbidden:false,focusCall:''};
    let JOB_POLL_MS=800;const jobUi={key:'',jobId:'',statusUrl:'',payload:null,job:null,busy:false,cancelling:false,noteEl:null,noteText:null,cancelEl:null};
    const ERR_CODE_LABELS={UPSTREAM_TIMEOUT:'上游超时',RATE_LIMITED:'请求被限流',AUTHENTICATION_FAILED:'鉴权失败',CONTENT_REJECTED:'内容审核未通过',PROVIDER_UNAVAILABLE:'供应商暂不可用',ASSET_INGESTION_FAILED:'资产摄取失败',STRUCTURED_OUTPUT_INVALID:'模型输出结构无效',INVALID_INPUT:'输入不合法',CONFIGURATION_OR_SKILL:'配置或 Skill 异常',CANCELLED:'已取消',INTERNAL_ERROR:'内部错误'};
    const ERR_ACTION_COPY={retry:'可安全重试：重试复用原动作与幂等语义，从最后成功边界继续。',modify_input:'需要修改输入：请调整任务书、提示词或素材后重新提交。',contact_admin:'需要管理员处理：请联系管理员检查凭证、配置或 Skill。',human_decision:'需要人工决策：请审阅后选择处理方式。',none:'该状态无需重试。'};
    const sample={task_id:'task_new',project_id:'campaign-visual-01',source_refs:[{ref_id:'brief-001',ref_type:'brief',excerpt:'请描述已确认的创作输入。',source_hash:null}],deliverable_goal:'描述需要生成的视觉内容、主体、风格和画面重点。',usage_context:'内部审核与决策',category_ref:{category_id:'generic_visual_delivery',version:'1.0'},known_facts:{audience:'内部审核人员',tone:'清晰、精致'},unknowns:{output_spec:'待确认'},asset_inputs:[],status:'draft'};
    async function api(path,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),120000);try{const res=await fetch(path,{...options,signal:controller.signal,headers:{'Content-Type':'application/json',...(options.headers||{})}});let data;try{data=await res.json()}catch{data={detail:'服务返回了无法解析的响应。'}}if(!res.ok){const err=new Error(formatError(data.detail));err.status=res.status;throw err}return data}catch(error){if(error.name==='AbortError')throw new Error('请求超时。后端可能仍在处理，请稍后刷新工程状态。');if(error instanceof TypeError)throw new Error('无法连接服务。请检查 FastAPI 是否运行，然后重试。');throw error}finally{clearTimeout(timer)}}
    function formatError(detail){if(typeof detail==='string')return detail;if(Array.isArray(detail))return detail.map(x=>`${(x.loc||[]).slice(1).join('.')||'输入'}：${x.msg}`).join('；');return '请求未完成，请检查输入后重试。'}
    function toast(message,type='info'){const el=document.createElement('div');el.className=`toast ${type==='error'?'toast--error':''}`;el.setAttribute('role',type==='error'?'alert':'status');el.textContent=message;$('#toasts').append(el);setTimeout(()=>el.remove(),5000)}
    function setBusy(busy,label='处理中…'){state.loading=busy;$$('button').forEach(b=>{if(!b.dataset.close&&!b.dataset.jobCancel)b.disabled=busy});if(busy)toast(label)}
    async function loadProjects(){try{const [health,data]=await Promise.all([api('/api/health'),api('/api/projects')]);state.projects=data.items;$('#health-text').textContent=health.model_config_available?'服务已就绪':'模型配置不可用';$('#health-dot').style.background=health.model_config_available?'var(--success)':'var(--warning)';renderNav()}catch(e){$('#health-text').textContent='服务未连接';$('#health-dot').style.background='var(--danger)';toast(e.message,'error');renderNav()}}
    function renderNav(){const nav=$('#project-list');if(!state.projects.length){nav.innerHTML='<div class="sidebar__empty">还没有工程。创建第一个视觉任务开始工作。</div>';return}nav.innerHTML=state.projects.map(p=>`<button class="project-item" data-project="${escapeAttr(p.project_id)}" aria-current="${state.current?.project_id===p.project_id}"><strong>${escapeHtml(p.project_id)}</strong><span>${p.failed_step?'处理失败 · 可重试':p.completed?'已完成':labels[p.state]||'等待开始'}</span></button>`).join('')}
    function escapeHtml(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(v){return escapeHtml(v)}
    function errInfo(err){
      if(!err||typeof err!=='object')return null;
      const ACTIONS=['retry','modify_input','contact_admin','human_decision','none'];
      if(typeof err.code==='string'&&typeof err.suggested_action==='string')return{stable:true,code:err.code,label:ERR_CODE_LABELS[err.code]||'',stage:typeof err.stage==='string'?err.stage:'',slot:Number.isInteger(err.candidate_slot)?err.candidate_slot:null,round:Number.isInteger(err.rework_round)?err.rework_round:null,retryable:err.retryable===true,action:ACTIONS.includes(err.suggested_action)?err.suggested_action:'none',trace:typeof err.trace_id==='string'?err.trace_id:'',detail:typeof err.detail==='string'?err.detail:'',retryAfter:typeof err.retry_after_seconds==='number'&&err.retry_after_seconds>=0?err.retry_after_seconds:null};
      // 旧错误对象兼容（{code,message,retryable} 或 {message}）：映射与服务端 JobStore 读取迁移语义一致。
      const retryable=err.retryable!==false;
      return{stable:false,code:typeof err.code==='string'?err.code:'',label:'',stage:'',slot:null,round:null,retryable,action:retryable?'retry':'contact_admin',trace:'',detail:typeof err.message==='string'?err.message:(typeof err.detail==='string'?err.detail:''),retryAfter:null};
    }
    function errText(info){if(!info)return'';const head=info.label||info.code||'处理失败';const wait=info.retryAfter!=null?`受策略约束，请等待约 ${Math.ceil(info.retryAfter)} 秒后再重试。`:'';return `${head}${info.detail?`：${info.detail}`:''}${wait}`}
    function errToastText(err){const info=errInfo(err);return info?`任务失败：${errText(info)}`:'任务未成功。'}
    function renderErrPanel(err){
      const info=errInfo(err);if(!info)return'';
      const rows=[`<dt>错误代码</dt><dd>${escapeHtml(info.code||'—')}${info.label?`（${escapeHtml(info.label)}）`:''}</dd>`];
      if(info.stage)rows.push(`<dt>阶段</dt><dd>${escapeHtml(labels[info.stage]||info.stage)}</dd>`);
      if(info.slot!=null)rows.push(`<dt>候选槽位</dt><dd>${info.slot}</dd>`);
      if(info.round!=null)rows.push(`<dt>返工轮次</dt><dd>${info.round}</dd>`);
      if(info.trace)rows.push(`<dt>trace</dt><dd>${escapeHtml(info.trace)}</dd>`);
      const wait=info.retryAfter!=null?`<p class="hint">请求被限流：受策略约束，请等待约 ${Math.ceil(info.retryAfter)} 秒后再重试。</p>`:'';
      return `<dl class="kv" style="max-width:460px;margin:0 auto 10px;text-align:left">${rows.join('')}</dl>${info.detail?`<p>${escapeHtml(info.detail)}</p>`:''}${wait}<p style="color:var(--muted)">${escapeHtml(ERR_ACTION_COPY[info.action]||ERR_ACTION_COPY.none)}</p>`;
    }
    function renderFailureStage(s,m){
      const fs=m.failed_step||null;
      const pid=state.current&&state.current.project_id;
      const watched=(pid&&jobUi.key===pid&&jobUi.job&&String(jobUi.job.status)==='failed')?jobUi.job:null;
      const err=(watched&&watched.error)||(fs&&fs.error);
      const info=errInfo(err);
      if(!info)return `<div class="empty"><div><div class="empty__icon">${icons.info}</div><h3>流程在 ${escapeHtml(labels[(fs&&fs.state)]||(fs&&fs.state)||'未知阶段')} 暂停</h3><p>后端能力暂不可用。修正模型、密钥或依赖后可安全重试。</p><button class="btn btn--primary" data-action="retry">从上一成功点重试</button></div></div>`;
      const stageLabel=info.stage||(fs&&fs.state)||'';
      const title=info.code==='CANCELLED'?'任务已取消':`流程在 ${labels[stageLabel]||stageLabel||'未知阶段'} 暂停`;
      let retryHtml='',attemptHtml='';
      if(watched){
        const a=Number.isInteger(watched.attempt)?watched.attempt:null,mx=Number.isInteger(watched.max_attempts)?watched.max_attempts:null;
        if(a!=null&&mx!=null)attemptHtml=`<p style="color:var(--muted)">已尝试 ${a}/${mx} 次。</p>`;
        if(info.action==='retry'){
          if(a!=null&&mx!=null&&a>=mx)attemptHtml+=`<p style="color:var(--muted)">已达到重试次数上限，自动重试已停止。</p>`;
          else retryHtml=`<button class="btn btn--primary" id="job-retry">重试原动作</button>`;
        }
      }else if(info.action==='retry')retryHtml=`<button class="btn btn--primary" data-action="retry">从上一成功点重试</button>`;
      return `<div class="empty"><div><div class="empty__icon">${icons.info}</div><h3>${escapeHtml(title)}</h3>${renderErrPanel(err)}${attemptHtml}${retryHtml?`<div class="button-row" style="justify-content:center">${retryHtml}</div>`:''}</div></div>`;
    }
    function jobWatchKey(pid){return `job-watch:${pid}`}
    function jobWatchSave(pid){if(!pid||!jobUi.jobId||!jobUi.statusUrl)return;try{sessionStorage.setItem(jobWatchKey(pid),JSON.stringify({job_id:jobUi.jobId,status_url:jobUi.statusUrl,payload:jobUi.payload}))}catch{}}
    function jobWatchClear(pid){try{sessionStorage.removeItem(jobWatchKey(pid))}catch{}}

    function stgsCoerce(f,raw){

    function renderHealthLive(){
      if(hlthUi.liveStatus==='idle'||hlthUi.liveStatus==='loading')return `<h3>liveness（进程存活）</h3><div class="skeleton"></div><p style="color:var(--muted);font-size:13px">正在检查进程存活…</p>`;
      if(hlthUi.liveStatus==='error')return `<h3>liveness（进程存活）</h3><div class="empty"><div><div class="empty__icon">${icons.info}</div><h3>服务不可达</h3><p>${escapeHtml(hlthUi.liveError)}</p><button type="button" class="btn btn--secondary" id="hlth-live-retry">立即重试</button></div></div>`;
      const d=hlthUi.live||{};
      const alive=String(d.status||'')==='alive';
      const trace=typeof d.trace_id==='string'&&HLTH_TRACE_RE.test(d.trace_id)?d.trace_id:'';
      return `<h3>liveness（进程存活）</h3><dl class="kv"><dt>状态</dt><dd>${alive?'<span class="badge badge--success">存活</span>':'<span class="badge badge--danger">异常</span>'}</dd><dt>检查时间</dt><dd>${escapeHtml(hlthFormatTime(d.checked_at))}</dd><dt>trace_id</dt><dd>${trace?`<span class="obs-event__trace">${escapeHtml(trace)}</span>`:'—'}</dd></dl><p class="hint">liveness 只表示进程存活，不代表依赖可用；模型、worker、队列、存储与资产代理的健康请看 readiness。</p>`;
    }
    function renderHealthReady(){
      if(hlthUi.readyStatus==='idle'||hlthUi.readyStatus==='loading')return `<h3>readiness（依赖就绪）</h3><div class="skeleton"></div><div class="skeleton"></div><p style="color:var(--muted);font-size:13px">正在执行只读探针…</p>`;
      if(hlthUi.readyStatus==='error')return `<h3>readiness（依赖就绪）</h3><div class="empty"><div><div class="empty__icon">${icons.info}</div><h3>就绪检查未完成</h3><p>${escapeHtml(hlthUi.readyError)}</p><p class="hint">自动轮询会继续重试，已有业务数据不受影响；也可立即手动重试。</p><button type="button" class="btn btn--secondary" id="hlth-ready-retry">立即重试</button></div></div>`;
      const d=hlthUi.ready||{};
      const overall=Object.prototype.hasOwnProperty.call(HLTH_OVERALL_LABELS,d.status)?d.status:'';
      const httpCopy=hlthUi.readyHttp===503?'HTTP 503 · 关键组件（存储/事件追加）不可用':'HTTP 200 · 局部退化仍返回 200，不代表全局故障';
      const trace=typeof d.trace_id==='string'&&HLTH_TRACE_RE.test(d.trace_id)?d.trace_id:'';
      const comps=d.components&&typeof d.components==='object'?d.components:{};
      const known=HLTH_COMPONENTS.map(name=>hlthComponentCard(name,comps[name])).join('');
      const extras=Object.keys(comps).filter(k=>!HLTH_COMPONENTS.includes(k)).map(name=>hlthComponentCard(name,comps[name])).join('');
      const banner=d.status==='degraded'?'<p class="hint">局部退化：部分组件异常，其余能力仍可用；这不是全局崩溃，可按各组件业务影响逐项处理。</p>':d.status==='not_ready'?'<p class="hint">关键组件不可用：业务持久化已暂停保护，修复存储/事件追加后会自动恢复；非关键组件状态见下方逐项列表。</p>':'';
      const diagBtn=trace&&hlthRole()==='admin'?`<button type="button" class="btn btn--secondary" id="hlth-diag-open">查看该次检查的内部诊断</button>`:'';
      const diagNote=hlthRole()==='admin'?'':'<p class="hint">内部诊断详情仅管理员可见，且以服务端 ACL 为最终裁决。</p>';
      return `<h3>readiness（依赖就绪）</h3><div class="hlth-overall"><span class="${HLTH_OVERALL_CLASS[overall]||'badge'}">${escapeHtml(HLTH_OVERALL_LABELS[overall]||'未知状态')}</span><span class="stgs-chip">${escapeHtml(httpCopy)}</span></div>${banner}<dl class="kv"><dt>检查时间</dt><dd>${escapeHtml(hlthFormatTime(d.checked_at))}</dd><dt>trace_id</dt><dd>${trace?`<span class="obs-event__trace">${escapeHtml(trace)}</span>`:'—'}</dd></dl>${diagBtn?`<div class="button-row" style="margin:10px 0">${diagBtn}</div>`:''}${diagNote}${renderHealthDiag()}<div class="hlth-components">${known}${extras}</div>`;
    }
    function hlthComponentCard(name,raw){
      // 白名单渲染：只消费 status/error_code/checked_at/business_impact；其余字段（含内部锚点、容量字节数、异常细节）不进入公共 DOM。
      const label=Object.prototype.hasOwnProperty.call(HLTH_COMPONENT_LABELS,name)?HLTH_COMPONENT_LABELS[name]:String(name);
      const c=raw&&typeof raw==='object'?raw:{};
      const status=typeof c.status==='string'&&Object.prototype.hasOwnProperty.call(HLTH_STATUS_LABELS,c.status)?c.status:'unknown';
      const code=typeof c.error_code==='string'&&/^[A-Z0-9_]+$/.test(c.error_code)?c.error_code:'';
      const impact=typeof c.business_impact==='string'?c.business_impact:'';
      const checked=typeof c.checked_at==='string'?c.checked_at:'';
      let hint='';
      if(name==='model_router'&&status==='offline')hint='<p class="hint">当前仅有离线项目：这是明确的离线标识，不代表生产供应商健康。</p>';
      if(name==='model_router'&&status==='not_configured')hint='<p class="hint">存在真实项目但未配置真实供应商：真实模型调用不可用，不会被误报为生产健康。</p>';
      return `<div class="hlth-component" data-hlth-component="${escapeAttr(String(name))}"><div class="hlth-component__head"><strong>${escapeHtml(label)}</strong><span class="${HLTH_STATUS_CLASS[status]||'badge'}">${escapeHtml(HLTH_STATUS_LABELS[status]||'未知')}</span></div><dl class="kv"><dt>错误码</dt><dd>${code?`<code>${escapeHtml(code)}</code>${HLTH_CODE_LABELS[code]?`（${escapeHtml(HLTH_CODE_LABELS[code])}）`:''}`:'—'}</dd><dt>检查时间</dt><dd>${escapeHtml(hlthFormatTime(checked))}</dd><dt>业务影响</dt><dd>${escapeHtml(impact||'—')}</dd></dl>${hint}</div>`;
    }
    function renderHealthDiag(){
      if(!hlthUi.diagTrace)return '';
      if(hlthUi.diagStatus==='loading')return `<div class="hlth-diag"><div class="skeleton"></div><p style="color:var(--muted);font-size:13px">正在读取 ${escapeHtml(hlthUi.diagTrace)} 的内部诊断…</p></div>`;
      if(hlthUi.diagStatus==='error'){
        const st=hlthUi.diagErrorStatus;
        const title=st===403?'服务端 ACL 拒绝了诊断读取':st===404?'诊断记录不存在或已过期':'诊断读取失败';
        const copy=st===403?'仅管理员且经服务端 ACL 放行后可读取；前端不会重试或绕过。':st===404?'服务端仅保留最近若干次检查的内部诊断；请重新执行健康检查获取新的 trace_id 后再试。':'可稍后重试；公共健康视图不受影响。';
        return `<div class="hlth-diag"><p class="field-error" role="alert">${escapeHtml(title)}${hlthUi.diagError?`：${escapeHtml(hlthUi.diagError)}`:''}</p><p class="hint">${escapeHtml(copy)}</p><div class="button-row"><button type="button" class="btn btn--secondary" id="hlth-diag-close">收起</button></div></div>`;
      }
      if(hlthUi.diagStatus!=='ready')return '';
      return `<div class="hlth-diag"><div class="section__head" style="margin-bottom:10px"><div><h3>内部诊断</h3><p>trace ${escapeHtml(hlthUi.diagTrace)} 的该次检查快照；内容可包含内部细节，仅 admin 经服务端 ACL 放行后可见</p></div><button type="button" class="btn btn--secondary" id="hlth-diag-close">收起</button></div><pre class="markdown hlth-diag__body">${escapeHtml(JSON.stringify(hlthUi.diag,null,2))}</pre></div>`;
    }
    function bindHealth(){
      const on=(id,fn)=>{const el=$('#'+id);if(el)el.addEventListener('click',fn)};
      on('hlth-refresh',()=>hlthManualRefresh());
      on('hlth-live-retry',()=>hlthManualRefresh());
      on('hlth-ready-retry',()=>hlthManualRefresh());
      on('hlth-diag-open',()=>{const d=hlthUi.ready||{};hlthOpenDiagnostics(d.trace_id)});
      on('hlth-diag-close',()=>hlthCloseDiagnostics());
    }
    function hlthRenderSection(){const host=$('#hlth-root');if(!host)return;host.innerHTML=renderHealthSection();bindHealth()}
    function renderTimeline(events=[]){const recent=events.slice(-6).reverse();if(!recent.length)return '<p style="color:var(--muted)">暂无活动记录。</p>';return `<div class="timeline">${recent.map(e=>`<div class="timeline__item"><strong>${escapeHtml(eventLabel(e))}</strong><time>${formatDate(e.timestamp)}</time></div>`).join('')}</div>`}function eventLabel(e){const x={project_created:'创建工程',step_started:'开始处理',step_succeeded:'完成节点',step_failed:'处理失败',branch_created:'创建分支',retry_started:'开始重试',inspection_completed:'完成画面质检',rework_completed:'完成画面返工'};return `${x[e.type]||'记录进度'}${e.state?' · '+(labels[e.state]||e.state):''}`}function formatDate(v){if(!v)return '—';try{return new Intl.DateTimeFormat('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return v}}
    async function advance(payload={},endpoint='advance'){
      if(!state.current||jobUi.busy)return;
      const pid=state.current.project_id;jobUi.busy=true;setBusy(true,'后端正在处理，进度完成后会自动刷新…');
      try{
        const accepted=await api(`/api/projects/${encodeURIComponent(pid)}/${endpoint}`,{method:'POST',body:JSON.stringify({...payload,offline:state.offline})});
        if(endpoint!=='advance'){state.current=accepted;await loadProjects();renderProject();toast('已保存到新的工作流检查点。');return}
        if(!accepted||!accepted.status_url)throw new Error('服务返回了无法识别的受理响应。');
        jobUi.key=pid;jobUi.payload=payload;jobUi.jobId=accepted.job_id||'';jobUi.statusUrl=accepted.status_url;jobWatchSave(pid);
        const job=await pollJob(pid,accepted.status_url);jobUi.job=job;
        if(String(job.status)==='failed'){jobWatchSave(pid);state.current=await api(`/api/projects/${encodeURIComponent(pid)}`);await loadProjects();renderProject();toast(errToastText(job.error),'error');return}
        jobWatchClear(pid);jobUi.job=null;jobUi.payload=null;
        state.current=await api(`/api/projects/${encodeURIComponent(pid)}`);await loadProjects();renderProject();
        toast(String(job.status)==='cancelled'?'任务已取消。':'已保存到新的工作流检查点。');
      }catch(e){toast(e.message,'error');try{state.current=await api(`/api/projects/${encodeURIComponent(pid)}`);renderProject()}catch{}}finally{jobUi.busy=false;jobUi.cancelling=false;setBusy(false);jobNoteClear()}
    }
    function showCreate(){const d=$('#project-dialog');$('#task-json').value=JSON.stringify(sample,null,2);$('#project-id').value='';$('#offline').checked=state.offline;$('#project-error').textContent='';$('#task-error').textContent='';d.showModal();setTimeout(()=>$('#project-id').focus(),0)}function closeDialog(){$('#project-dialog').close()}
    async function createProject(ev){ev.preventDefault();const id=$('#project-id').value.trim();let task;$('#project-error').textContent='';$('#task-error').textContent='';if(!/^[A-Za-z0-9][A-Za-z0-9_-]{1,63}$/.test(id)){ $('#project-error').textContent='请输入 2–64 位合法工程 ID。';$('#project-id').focus();return}try{task=JSON.parse($('#task-json').value)}catch{$('#task-error').textContent='JSON 格式无效，请检查逗号、引号和括号。';$('#task-json').focus();return}state.offline=$('#offline').checked;localStorage.setItem('studio-offline',String(state.offline));setBusy(true,'正在创建并启动真实工作流…');try{state.current=await api('/api/projects',{method:'POST',body:JSON.stringify({project_id:id,task_card:task,offline:state.offline})});closeDialog();await loadProjects();renderProject();toast('工程已创建并保存首个检查点。')}catch(e){$('#task-error').textContent=e.message;toast(e.message,'error')}finally{setBusy(false)}}
    function closeSidebar(){$('#sidebar').classList.remove('is-open');$('#menu-button').setAttribute('aria-expanded','false')}
    document.addEventListener('click',e=>{const project=e.target.closest('[data-project]'),n=e.target.closest('[data-new]'),action=e.target.closest('[data-action]'),confirm=e.target.closest('[data-confirm]'),manual=e.target.closest('[data-manual]'),quality=e.target.closest('[data-quality]'),candidate=e.target.closest('[data-candidate]'),traceLink=e.target.closest('[data-trace-call]');if(project)openProject(project.dataset.project);if(n)showCreate();if(action)advance({},action.dataset.action==='retry'?'retry':'advance');if(confirm){const actor=prompt('请输入操作者标识');if(!actor)return;if(confirm.dataset.confirm==='task')advance({task_spec_action:'confirm',actor});if(confirm.dataset.confirm==='final')advance({final_action:'confirm',actor});if(confirm.dataset.confirm==='continue')advance({final_action:'continue',actor})}if(manual)advance({manual_action:manual.dataset.manual});if(quality){const actor=prompt('请输入操作者标识');if(!actor)return;const expense_confirmed=quality.dataset.quality!=='continue_generation'||confirm('继续生成将开启新的付费预算段。确认本次费用影响并继续？');if(expense_confirmed)advance({quality_action:quality.dataset.quality,actor,expense_confirmed,idempotency_key:`quality-${quality.dataset.quality}-${Date.now()}`})}if(candidate){$$('[data-candidate]').forEach(x=>x.setAttribute('aria-pressed',String(x===candidate)));$('#select-button').disabled=false;$('#select-button').dataset.selected=candidate.dataset.candidate}if(traceLink)traceFocusCall(traceLink.dataset?traceLink.dataset.traceCall:'')});
    document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();const fd=new FormData(e.target),answers={};for(const [k,v] of fd){if(k.endsWith('__custom'))continue;const custom=fd.get(`${k}__custom`);answers[k]=String(custom||v).trim()}advance({clarification_answers:answers})}});
    $('#content').addEventListener('click',e=>{const btn=e.target.closest('#select-button');if(btn&&state.current?.snapshot?.phase==='waiting_master_selection'&&btn.dataset.selected)advance({selected_id:btn.dataset.selected})});$('#new-button').addEventListener('click',showCreate);$('#refresh-button').addEventListener('click',()=>hlthUi.active?hlthManualRefresh():stgsUi.active?stgsReload():(state.current?openProject(state.current.project_id):loadProjects().then(renderHome)));$('#project-form').addEventListener('submit',createProject);const onInit=(id,ev,fn)=>{const el=$('#'+id);if(el)el.addEventListener(ev,fn)};onInit('health-button','click',hlthOpen);onInit('settings-button','click',stgsOpen);onInit('stgs-danger-close','click',stgsDangerClose);onInit('stgs-danger-cancel','click',stgsDangerClose);onInit('stgs-danger-confirm','click',stgsDangerConfirm);onInit('stgs-danger-dialog','cancel',e=>{e.preventDefault();stgsDangerClose()});onInit('stgs-apply-close','click',stgsApplyClose);onInit('stgs-apply-cancel','click',stgsApplyClose);onInit('stgs-apply-confirm','click',stgsApplyConfirm);onInit('stgs-apply-dialog','cancel',e=>{e.preventDefault();stgsApplyClose()});onInit('stgs-danger-check','change',stgsDangerRender);onInit('stgs-apply-project','change',()=>{const sel=$('#stgs-apply-project');if(!sel)return;stgsUi.applyProject=sel.value;stgsApplyLoadBranches(stgsUi.applyProject)});onInit('stgs-apply-checkpoint','change',()=>{const sel=$('#stgs-apply-checkpoint');if(!sel)return;stgsUi.applyCheckpoint=sel.value;stgsApplyPreviewRender()});onInit('reopen-close','click',histReopenClose);onInit('reopen-cancel','click',histReopenClose);onInit('reopen-confirm','click',histReopenConfirm);onInit('reopen-dialog','cancel',e=>{e.preventDefault();histReopenClose()});$$('[data-close]').forEach(b=>b.addEventListener('click',closeDialog));$('#project-dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});$('#menu-button').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('is-open');$('#menu-button').setAttribute('aria-expanded',String(open))});
    loadProjects().then(renderHome);
  </script>
